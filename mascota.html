<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis mascotas · TECNOPATITAS</title><meta name="description" content="Mis mascotas"><meta name="robots" content="noindex"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="mascota" data-guard="owner"><a class="skip" href="#main">Saltar al contenido</a><div id="site-header"></div><main id="main"><div class="app"><nav class="side" aria-label="Sección"><a href="perfil.html">👤 Perfil</a><a data-only="owner" hidden href="mascota.html" aria-current="page">🐕 Mis mascotas</a><a data-only="owner" hidden href="carnet.html">🩺 Carnet digital</a><a href="notificaciones.html">🔔 Notificaciones</a><a href="chat.html">💬 Atención al cliente</a><a href="planes.html">⭐ Mi suscripción</a><a data-only="business" hidden href="panel-aliado.html">🏪 Panel de aliado</a><a data-only="admin" hidden href="admin.html">🛠️ Administración</a></nav><div><h1 style="font-size:2rem">Mis mascotas</h1><p class="mut" id="m-contador" aria-live="polite">…</p><div class="msg" id="msg-global" hidden></div><div class="pets" id="m-lista" aria-live="polite"></div><div class="card" id="m-form-card" style="margin-top:20px"><h3 id="m-form-title">Agregar mascota</h3><p class="note" id="m-limite" hidden></p><form id="f-mascota" novalidate><div class="fgrid"><label>Nombre<input id="m-nombre" type="text" required maxlength="60" autocomplete="off"></label><label>Especie<select id="m-especie" required><option value="">Selecciona una opción</option><option value="perro">Perro</option><option value="gato">Gato</option><option value="ave">Ave</option><option value="conejo">Conejo</option><option value="pequeno_mamifero">Pequeño mamífero</option><option value="otro">Otro</option></select></label><label>Raza (opcional)<input id="m-raza" type="text" maxlength="80"></label><label>Sexo (opcional)<select id="m-sexo"><option value="">Sin indicar</option><option value="macho">Macho</option><option value="hembra">Hembra</option></select></label><label>Fecha de nacimiento aproximada<input id="m-nac" type="date" min="1990-01-01"></label><label>Peso en kg (opcional)<input id="m-peso" type="number" step="0.01" min="0.01" max="200" inputmode="decimal"></label></div><label>Fotografía (opcional)<input id="m-foto" type="file" accept="image/jpeg,image/png,image/webp"><small id="m-foto-ayuda">JPG, PNG o WebP. Se reduce de tamaño automáticamente y se eliminan los datos ocultos de la foto (como la ubicación).</small></label><label class="ck" id="m-quitar-fila" hidden><input id="m-quitar" type="checkbox"> Quitar la foto actual (si no subes otra)</label><label>Descripción (opcional)<textarea id="m-desc" rows="3" maxlength="1000"></textarea></label><label>Información veterinaria relevante (opcional)<textarea id="m-vet" rows="3" maxlength="2000"></textarea><small>Alergias, condiciones, medicamentos… Solo tú la ves.</small></label><div class="msg" id="msg-form" hidden></div><div class="row"><button class="btn coral" id="m-guardar" type="submit">Guardar mascota</button><button class="btn ghost" id="m-cancelar" type="button" hidden>Cancelar edición</button></div></form></div></div></div></main><div id="site-footer"></div><div id="toast" role="status" aria-live="polite"></div><script src="js/config.js"></script><script src="js/tp-client.js"></script><script src="js/tp-ui.js"></script><script src="js/layout.js"></script><script src="js/guard.js"></script><script src="js/media.js"></script><script src="js/tp-pets.js"></script><script src="js/pages/mascota.js"></script></body></html>
