<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta · TECNOPATITAS</title><meta name="description" content="Empieza a cuidar a tus mascotas."><meta name="robots" content="noindex"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="registro"><a class="skip" href="#main">Saltar al contenido</a><div id="site-header"></div><main id="main"><section class="authwrap"><div class="authart" aria-hidden="true">🐾</div><div class="card authcard"><h1>Crear cuenta</h1><p>Empieza a cuidar a tus mascotas.</p><form id="f-registro" novalidate><label>Nombre<input name="nombre" type="text" required minlength="2" maxlength="80" autocomplete="name"></label><label>Correo electrónico<input name="email" type="email" required maxlength="254" autocomplete="email"></label><label>Contraseña (mínimo 10 caracteres)<input name="pw" type="password" required minlength="10" maxlength="72" autocomplete="new-password"></label><label>Repite la contraseña<input name="pw2" type="password" required minlength="10" maxlength="72" autocomplete="new-password"></label><label>Tipo de cuenta<select name="tipo" required><option value="">Selecciona una opción</option><option value="owner">Dueño de mascota</option><option value="business">Aliado comercial</option></select></label><label class="ck long"><input type="checkbox" name="consent" required><span>He leído y acepto el <a href="privacidad.html" target="_blank" rel="noopener">Aviso de privacidad</a> y los <a href="terminos.html" target="_blank" rel="noopener">Términos y condiciones</a>, y el uso de mis datos para gestionar mi cuenta. Declaro tener 18 años o más (o contar con la autorización de mi madre, padre o tutor).</span></label><div id="captcha-host" class="captchahost"></div><div class="msg" id="msg" hidden></div><button class="btn coral" type="submit">Crear cuenta</button></form><p class="sub">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>. Las cuentas de administración no se crean desde aquí.</p></div></section></main><div id="site-footer"></div><div id="toast" role="status" aria-live="polite"></div><script src="js/config.js"></script><script src="js/tp-client.js"></script><script src="js/tp-ui.js"></script><script src="js/legal.js"></script><script src="js/tp-captcha.js"></script><script src="js/layout.js"></script><script src="js/pages/registro.js"></script></body></html>
