<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta · TECNOPATITAS</title><meta name="description" content="Empieza a cuidar a tus mascotas."><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="registro"><a class="skip" href="#main">Saltar al contenido</a><div id="site-header"></div><main id="main"><section class="authwrap"><div class="authart" aria-hidden="true">🐾</div><div class="card authcard"><h1>Crear cuenta</h1><p>Empieza a cuidar a tus mascotas.</p><form data-stage="3"><label>Nombre<input name="nombre" type="text" required maxlength="80" autocomplete="name"></label><label>Correo electrónico<input name="email" type="email" required autocomplete="email"></label><label>Contraseña (mínimo 8 caracteres)<input name="pw" type="password" required minlength="8" autocomplete="new-password"></label><label>Tipo de cuenta<select name="tipo" required><option value="">Selecciona una opción</option><option>Dueño de mascota</option><option>Aliado comercial</option></select></label><label class="ck"><input type="checkbox" required> Acepto el uso de mis datos para gestionar mi cuenta.</label><button class="btn coral">Crear cuenta</button></form><p class="sub">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>. Las cuentas de administración no se crean desde aquí.</p></div></section></main><div id="site-footer"></div><div id="toast" role="status" aria-live="polite"></div><script src="js/layout.js"></script></body></html>
